# Render blueprint: the Django API (Docker) for the hosted demo.
# Database: Neon Postgres (DATABASE_URL). Frontend: Cloudflare Pages (FAMILYTREE_CORS_ORIGINS).
services:
  - type: web
    name: familytree-api
    runtime: docker
    plan: free
    region: frankfurt # next to the Neon database (aws eu-central-1)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/stats/
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # paste the Neon connection string when applying the blueprint
      - key: FAMILYTREE_CORS_ORIGINS
        value: https://familytree-7d2.pages.dev # the Cloudflare Pages frontend
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_DEBUG
        value: "0"
      # Deliberately open: the portfolio demo holds fictional data and visitors use it without a key.
      # Remove this and set FAMILYTREE_API_TOKEN instead to lock the API.
      - key: FAMILYTREE_PUBLIC_DEMO
        value: "1"
